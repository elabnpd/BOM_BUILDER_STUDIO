'use strict';const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>crypto.randomUUID(), key='panel-bom-studio-v4';
const initial=()=>({"fields": [], "materials": [], "rules": [], "history": []});let db;try{db=JSON.parse(localStorage.getItem(key))||initial()}catch{db=initial()}let page='Dashboard',config={},result=null;const pages=['Dashboard','Generate BoM','Input Master','Material Master','Rule Master','History','Backup & Restore'];function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch(e){alert('Storage failed. Export a backup immediately. '+e.message)}}function change(p){page=p;render()}function btn(t,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${t}</button>`}function table(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="99">No records yet.</td></tr>'}</tbody></table></div>`}function field(label,id,value='',type='text'){return `<div><label for="${id}">${esc(label)}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}function select(id,opts,val){return `<select id="${id}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`}function dialog(title,body,action){$('modal').innerHTML=`<h2>${esc(title)}</h2>${body}<div class="bar">${btn('Save',action)}${btn('Cancel',"$('modal').close()",'secondary')}</div>`;$('modal').showModal()}function commit(){save();$('modal').close();render()}function render(){ $('nav').innerHTML=pages.map(p=>btn(p,`change('${p}')`,p===page?'active':'')).join('');let html=`<h1>${page}</h1>`;if(page==='Dashboard')html+=`<p class="muted">Build approved panel BoMs from your own configurable inputs, materials and rules.</p><div class="grid">${[['Input fields',db.fields.length],['Materials',db.materials.length],['Rules',db.rules.length],['Saved BoMs',db.history.length]].map(([l,n])=>`<section><small>${l}</small><div class="stat">${n}</div></section>`).join('')}</div><section><h2>Getting started</h2><p>1. Customize Input Master. 2. Add approved material codes. 3. Create selection rules. 4. Generate and review a BoM. 5. Export CSV or save a snapshot.</p><p class="warn">Import the supplied JSON master to load source-derived candidate rules. Review all new combinations before release. This application runs locally in your browser; GitHub Pages hosts the interface, not your data. Export backups regularly.</p></section>`;
if(page==='Input Master')html+=`<section>${btn('Add input','editField()')} ${btn('Import CSV',"$('inputscsv').click()",'secondary')}<input type="file" id="inputscsv" accept=".csv" hidden onchange="importMasterCSV(this,'inputs')">${table(['Name','Type','Options','Required','Actions'],db.fields.map(f=>[esc(f.name),esc(f.type),esc(f.options.join(', ')),f.required?'Yes':'No',btn('Edit',`editField('${f.id}')`,'secondary')+' '+btn('Delete',`remove('fields','${f.id}')`,'danger')]))}</section>`;
if(page==='Material Master')html+=`<section><div class="bar">${btn('Add material','editMaterial()')}${btn('Import CSV',"$('csvfile').click()",'secondary')}${btn('CSV template','downloadCSV(\'materials-template.csv\',[[\'code\',\'description\',\'uom\',\'spec\',\'brand\']])','secondary')}</div><input type="file" id="csvfile" accept=".csv" hidden onchange="importMaterials(this)">${table(['Code','Description','UOM','Specification','Brand','Actions'],db.materials.map(m=>[esc(m.code),esc(m.description),esc(m.uom),esc(m.spec),esc(m.brand),btn('Edit',`editMaterial('${m.id}')`,'secondary')+' '+btn('Delete',`remove('materials','${m.id}')`,'danger')]))}</section>`;

function editField(id){let f=db.fields.find(x=>x.id===id)||{name:'',type:'select',options:[],required:true};dialog('Input definition',`<div class="grid">${field('Input name','fname',f.name)}<div><label>Type</label>${select('ftype',[['select','Dropdown'],['number','Number'],['text','Text']],f.type)}</div></div>${field('Dropdown options (comma separated)','fopts',f.options.join(','))}<p><label><input style="width:auto" type="checkbox" id="freq" ${f.required?'checked':''}> Required</label></p>`,`saveField('${id||''}')`)}function saveField(id){let name=$('fname').value.trim(),type=$('ftype').value,options=[...new Set($('fopts').value.split(',').map(x=>x.trim()).filter(Boolean))];if(!name||db.fields.some(f=>f.name.toLowerCase()===name.toLowerCase()&&f.id!==id)||type==='select'&&!options.length)return alert('Enter a unique name and dropdown options if applicable.');let f={id:id||uid(),name,type,options,required:$('freq').checked};upsert('fields',f);commit()}
function editMaterial(id){let m=db.materials.find(x=>x.id===id)||{};dialog('Material definition',`<div class="grid">${['code','description','uom','spec','brand'].map(k=>field(k,'m'+k,m[k]||'')).join('')}</div>`,`saveMaterial('${id||''}')`)}function saveMaterial(id){let m={id:id||uid()};for(let k of ['code','description','uom','spec','brand'])m[k]=$('m'+k).value.trim();if(!m.code||!m.description||!m.uom||db.materials.some(x=>x.code===m.code&&x.id!==id))return alert('Unique code, description and UOM required.');upsert('materials',m);commit()}function upsert(k,x){let i=db[k].findIndex(y=>y.id===x.id);if(i<0)db[k].push(x);else db[k][i]=x;result=null}function remove(k,id){if(k==='fields'&&db.rules.some(r=>r.conditions.some(c=>c.field===id))||k==='materials'&&db.rules.some(r=>r.material===id))return alert('Referenced by a rule. Remove or edit that rule first.');if(confirm('Delete this record?')){db[k]=db[k].filter(x=>x.id!==id);result=null;save();render()}}
let editing=[];function editRule(id){if(!db.materials.length)return alert('Add materials first.');let r=db.rules.find(x=>x.id===id)||{name:'',logic:'ALL',conditions:[],material:db.materials[0].id,qty:'1',slot:'',priority:0,enabled:true};editing=structuredClone(r.conditions);dialog('Rule definition',`<div class="grid">${field('Rule name','rname',r.name)}<div><label>Match</label>${select('rlogic',[['ALL','ALL (AND)'],['ANY','ANY (OR)']],r.logic)}</div></div><h3>Conditions</h3><div id="conditions"></div>${btn('Add condition','addCondition()','secondary')}<p class="muted">No conditions = always match.</p><div class="grid"><div><label>Material</label>${select('rmat',db.materials.map(m=>[m.id,m.code+' — '+m.description]),r.material)}</div>${field('Quantity (number, @Input Name or @Input Name|rating)','rqty',r.qty)}${field('Selection slot (optional)','rslot',r.slot)}${field('Priority','rpriority',r.priority,'number')}</div><p><label><input style="width:auto" type="checkbox" id="renabled" ${r.enabled?'checked':''}> Enabled</label></p>`,`saveRule('${id||''}')`);drawConditions()}function drawConditions(){$('conditions').innerHTML=editing.map((c,i)=>`<div class="condition">${select('cf'+i,db.fields.map(f=>[f.id,f.name]),c.field)}${select('co'+i,['=','!=','>','>=','<','<=','in','contains','count =','count >'].map(x=>[x,x]),c.op)}<input id="cv${i}" value="${esc(c.value)}" placeholder="Value (count: rating|number)">${btn('×',`dropCondition(${i})`,'danger')}</div>`).join('')}function readConditions(){editing=editing.map((c,i)=>({field:$('cf'+i).value,op:$('co'+i).value,value:$('cv'+i).value.trim()}))}function addCondition(){if(!db.fields.length)return alert('Add input fields first.');readConditions();editing.push({field:db.fields[0].id,op:'=',value:''});drawConditions()}function dropCondition(i){readConditions();editing.splice(i,1);drawConditions()}function saveRule(id){readConditions();let r={id:id||uid(),name:$('rname').value.trim(),logic:$('rlogic').value,conditions:editing,material:$('rmat').value,qty:$('rqty').value.trim(),slot:$('rslot').value.trim(),priority:Number($('rpriority').value),enabled:$('renabled').checked};if(!r.name||!r.qty||!Number.isFinite(r.priority)||editing.some(c=>!c.value))return alert('Complete rule name, quantity, priority and conditions.');if(r.qty.startsWith('@')?!db.fields.some(f=>f.name===r.qty.slice(1).split('|')[0]&&(r.qty.includes('|')||f.type==='number'||f.type==='select'&&f.options.every(x=>Number.isFinite(Number(x))))):!(Number(r.qty)>0&&Number.isFinite(Number(r.qty))))return alert('Quantity must be positive or reference a numeric input using @Input Name.');upsert('rules',r);commit()}
function capCount(a,r){return String(a||'').split('+').map(x=>x.trim()).filter(x=>x===r).length}function qtyValue(q){let [n,r]=q.slice(1).split('|');let a=config[db.fields.find(f=>f.name===n)?.id];return r===undefined?Number(a):capCount(a,r)}function match(c){let a=config[c.field],b=c.value;if(a===undefined||a==='')return false;if(c.op.startsWith('count ')){let [r,n]=b.split('|');let k=capCount(a,r);return c.op==='count ='?k===Number(n):k>Number(n)}switch(c.op){case '=':return a===b;case '!=':return a!==b;case 'in':return b.split(',').map(x=>x.trim()).includes(a);case 'contains':return a.includes(b);default:if(!Number.isFinite(Number(a))||!Number.isFinite(Number(b)))return false;return c.op==='>'?+a>+b:c.op==='>='?+a>=+b:c.op==='<'?+a<+b:+a<=+b}}
function generate(){config={};let errors=['Model-dependent wiring and termination rules were removed. Engineering review and replacement rules are required before production use.'];for(let f of db.fields){let v=$('cfg'+f.id).value.trim();config[f.id]=v;if(f.required&&!v)errors.push('Missing input: '+f.name);if(v&&f.type==='number'&&!Number.isFinite(Number(v)))errors.push('Invalid number: '+f.name)}for(let f of db.fields){let rr=db.rules.filter(r=>r.enabled&&r.qty.startsWith('@'+f.name+'|'));if(!rr.length)continue;let allowed=new Set(rr.map(r=>r.qty.split('|')[1]));let v=config[f.id];if(v!=='0'&&v.split('+').some(x=>!allowed.has(x.trim())))errors.push('Unsupported capacitor value in '+f.name+': '+v+' (use + between ratings, or 0 for none)');}let active=db.rules.filter(r=>r.enabled),matched=active.filter(r=>!r.conditions.length||(r.logic==='ALL'?r.conditions.every(match):r.conditions.some(match))),chosen=matched.filter(r=>!r.slot);for(let slot of new Set(active.map(r=>r.slot).filter(Boolean))){let list=matched.filter(r=>r.slot===slot).sort((a,b)=>b.priority-a.priority);if(!list.length)errors.push('No matching rule for slot: '+slot);else if(list.length>1&&list[0].priority===list[1].priority)errors.push('Conflicting rules in slot: '+slot);else chosen.push(list[0])}if(!matched.length)errors.push('No rules matched.');let map=new Map();for(let r of chosen){let m=db.materials.find(x=>x.id===r.material),q=r.qty.startsWith('@')?qtyValue(r.qty):Number(r.qty);if(!m||!Number.isFinite(q)||q<=0){errors.push('Invalid material or quantity in '+r.name);continue}let row=map.get(m.id)||{...m,qty:0,rules:[]};row.qty+=q;row.rules.push(r.name);map.set(m.id,row)}result={rows:[...map.values()],errors,inputs:db.fields.map(f=>[f.name,config[f.id]]),date:new Date().toISOString()};showResult()}
function showResult(){let r=result;$('output').innerHTML=`<section><h2>Generated BoM · ${r.rows.length} items</h2>${r.errors.length?`<div class="warn">${esc(r.errors.join('\n'))}</div>`:'<p class="warn">Draft only: inferred rules and new configurations require engineering review. Matching rules do not establish completeness.</p>'}${table(['Code','Description','Spec','Qty','UOM','Matched rules'],r.rows.map(m=>[esc(m.code),esc(m.description),esc(m.spec),m.qty,esc(m.uom),esc(m.rules.join(', '))]))}${!r.errors.length?`<div class="bar">${btn('Export draft CSV','exportResult(result)')}${btn('Save snapshot','snapshot()','secondary')}</div>`:''}</section>`}function snapshot(){if(!result||result.errors.length)return;db.history.push({...structuredClone(result),id:uid(),ref:'BOM-'+Date.now()});save();alert('Snapshot saved.')}function exportHistory(id){exportResult(db.history.find(h=>h.id===id))}function exportResult(r){downloadCSV((r.ref||'panel-bom')+'.csv',[['Material Code','Description','Specification','Brand','Quantity','UOM','Rules'],...r.rows.map(m=>[m.code,m.description,m.spec,m.brand,m.qty,m.uom,m.rules.join('; ')])])}function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function downloadCSV(name,rows){download(name,'\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+\-@\t\r]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function backup(){download('bom-backup.json',JSON.stringify(db,null,2),'application/json')}
function parseCSV(s){let rows=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if(c==='\n'&&!quoted){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v=''}else v+=c}if(quoted)throw Error('Unclosed quote');if(v||row.length){row.push(v.replace(/\r$/,''));rows.push(row)}return rows}async function importMaterials(el){try{let rows=parseCSV((await el.files[0].text()).replace(/^\ufeff/,'')),head=rows.shift().map(x=>x.trim().toLowerCase());if(!['code','description','uom'].every(x=>head.includes(x)))throw Error('Required headers: code, description, uom');let incoming=[],seen=new Set(db.materials.map(m=>m.code));for(let row of rows){if(row.every(x=>!x.trim()))continue;let m={id:uid()};for(let k of ['code','description','uom','spec','brand'])m[k]=(row[head.indexOf(k)]||'').trim();if(!m.code||!m.description||!m.uom||seen.has(m.code))throw Error('Invalid or duplicate code: '+m.code);seen.add(m.code);incoming.push(m)}db.materials.push(...incoming);result=null;save();render()}catch(e){alert(e.message)}finally{el.value=''}}async function restore(el){try{let d=JSON.parse(await el.files[0].text());if(!['fields','materials','rules','history'].every(k=>Array.isArray(d[k])))throw Error('Invalid backup structure');for(let k of ['fields','materials','rules','history'])if(d[k].some(x=>!x||typeof x.id!=='string'||!/^[a-f0-9-]+$/i.test(x.id))||new Set(d[k].map(x=>x.id)).size!==d[k].length)throw Error('Invalid record IDs');if(d.fields.some(f=>typeof f.name!=='string'||!['select','number','text'].includes(f.type)||!Array.isArray(f.options)||f.options.some(o=>typeof o!=='string'))||d.materials.some(m=>!['code','description','uom','spec','brand'].every(k=>typeof m[k]==='string'))||d.rules.some(r=>typeof r.name!=='string'||typeof r.qty!=='string'||typeof r.slot!=='string'||!Number.isFinite(r.priority)||!Array.isArray(r.conditions)||!d.materials.some(m=>m.id===r.material)||r.conditions.some(c=>!d.fields.some(f=>f.id===c.field)||typeof c.value!=='string'))||d.history.some(h=>!Array.isArray(h.rows)||h.rows.some(r=>!Array.isArray(r.rules))))throw Error('Invalid backup records');if(confirm('Replace all current data?')){db=d;config={};result=null;save();render()}}catch(e){alert(e.message)}finally{el.value=''}}async function importMasterCSV(el,kind){try{const rows=parseCSV((await el.files[0].text()).replace(/^\ufeff/,''));const headers=rows.shift().map(x=>x.trim());const data=rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()])));const next=structuredClone(db);if(kind==='inputs'){if(!['Input','Type','Options','Required'].every(h=>headers.includes(h)))throw Error('Expected Input, Type, Options, Required headers');const seen=new Set();next.fields=data.map(r=>{if(!r.Input||seen.has(r.Input)||!['select','number','text'].includes(r.Type))throw Error('Invalid input: '+r.Input);seen.add(r.Input);const options=r.Options.split(',').map(x=>x.trim()).filter(Boolean);if(r.Type==='select'&&!options.length)throw Error('Missing options: '+r.Input);return {id:db.fields.find(f=>f.name===r.Input)?.id||uid(),name:r.Input,type:r.Type,options,required:/^(true|yes|1)$/i.test(r.Required)}});if(next.rules.some(r=>r.conditions.some(c=>!next.fields.some(f=>f.id===c.field))))throw Error('Existing rules reference removed inputs. Back up and clear rules first.');}else{if(!['Rule Name','Material Code','Quantity','Logic','Conditions','Slot','Priority','Enabled'].every(h=>headers.includes(h)))throw Error('Expected V2 rule CSV headers');next.rules=data.map(r=>{const m=next.materials.find(m=>m.code===r['Material Code']);if(!m)throw Error('Missing material: '+r['Material Code']);const conditions=JSON.parse(r.Conditions).map(c=>{const f=next.fields.find(f=>f.name===c.field);if(!f||!['=','!=','>','>=','<','<=','in','contains','count =','count >'].includes(c.op))throw Error('Invalid condition: '+c.field);return {field:f.id,op:c.op,value:String(c.value)}});if(!['ALL','ANY'].includes(r.Logic)||!Number.isFinite(Number(r.Priority))||!(Number(r.Quantity)>0||r.Quantity.startsWith('@')&&next.fields.some(f=>f.name===r.Quantity.slice(1).split('|')[0])))throw Error('Invalid rule: '+r['Rule Name']);return {id:uid(),name:r['Rule Name'],logic:r.Logic,conditions,material:m.id,qty:r.Quantity,slot:r.Slot,priority:Number(r.Priority),enabled:/^(true|yes|1)$/i.test(r.Enabled)}})}if(!data.length)throw Error('Empty CSV');if(confirm('Replace '+kind+' master with '+data.length+' records? Other masters remain unchanged.')){db=next;config={};result=null;save();render();alert('Imported '+data.length+' records.')}}catch(e){alert(e.message)}finally{el.value=''}}

function setupBulk(){
 const k={'Input Master':'fields','Material Master':'materials','Rule Master':'rules','History':'history'}[page]; if(!k)return;
 const tableEl=$('view').querySelector('table'); if(!tableEl||!db[k].length)return;
 const bar=document.createElement('div');bar.className='bar';
 bar.innerHTML='<button class="secondary" id="bulkSelect">Select all</button><button class="secondary" id="bulkClear">Clear selection</button><button class="danger" id="bulkDelete" disabled>Delete selected</button><button class="danger" id="bulkAll">Delete all</button><span id="bulkCount" class="muted"></span>';
 tableEl.closest('.scroll').before(bar);
 const th=document.createElement('th');th.textContent='Select';tableEl.tHead.rows[0].prepend(th);
 const checks=Array.from(tableEl.tBodies[0].rows).map((row,i)=>{const td=document.createElement('td'),c=document.createElement('input');c.type='checkbox';c.style.width='auto';c.setAttribute('aria-label','Select record '+(i+1));c.value=db[k][i].id;td.append(c);row.prepend(td);return c});
 const selected=()=>checks.filter(c=>c.checked).map(c=>c.value);
 const update=()=>{const n=selected().length;$('bulkCount').textContent=n+' / '+checks.length+' selected';$('bulkDelete').disabled=!n;};
 checks.forEach(c=>c.onchange=update);$('bulkSelect').onclick=()=>{checks.forEach(c=>c.checked=true);update()};$('bulkClear').onclick=()=>{checks.forEach(c=>c.checked=false);update()};$('bulkDelete').onclick=()=>bulkRemove(k,selected());$('bulkAll').onclick=()=>bulkRemove(k,db[k].map(x=>x.id));update();
}
function bulkRemove(k,ids){
 const set=new Set(ids);if(!set.size)return;
 const dependent=db.rules.filter(r=>k==='fields'?r.conditions.some(c=>set.has(c.field)):k==='materials'?set.has(r.material):false);
 if(dependent.length){alert('Deletion blocked: '+dependent.length+' rules reference selected records. Delete or edit those rules first. No records were deleted.');return;}
 if(!confirm('Permanently delete '+set.size+' record(s) from '+page+'? Export a backup first if needed.'))return;
 const next={...db,[k]:db[k].filter(x=>!set.has(x.id))};
 try{localStorage.setItem(key,JSON.stringify(next))}catch(e){alert('Deletion failed: '+e.message);return;}
 db=next;if(k==='fields')for(const id of set)delete config[id];result=null;render();
}

render();
</script></body></html>
